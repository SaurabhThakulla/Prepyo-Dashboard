services:
  # Prepyo Go API Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prepyo-go-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - APP_ENV=development
      - DATABASE_URL=postgres://prepyo:prepyo_pass@postgres:5432/prepyo_db?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: prepyo-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=prepyo
      - POSTGRES_PASSWORD=prepyo_pass
      - POSTGRES_DB=prepyo_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepyo -d prepyo_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache & Job Queue
  redis:
    image: redis:7-alpine
    container_name: prepyo-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
